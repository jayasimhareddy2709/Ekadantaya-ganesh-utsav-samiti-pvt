      <script>
        // Data Store
        let collections = [];
        let expenses = [];
        const TARGET_GOAL = 60000;

        // Elements
        const collTableBody = document.getElementById('collectionTableBody');
        const expTableBody = document.getElementById('expenseTableBody');
        const emptyCollMsg = document.getElementById('emptyCollectionMessage');
        const emptyExpMsg = document.getElementById('emptyExpenseMessage');
        
        const totalCollDisp = document.getElementById('totalCollectedDisplay');
        const totalSpentDisp = document.getElementById('totalSpentDisplay');
        const cashInHandDisp = document.getElementById('cashInHandDisplay');
        
        const progressBar = document.getElementById('progressBar');
        const progressPctText = document.getElementById('progressBarPercentage');
        const remainingGapText = document.getElementById('remainingGapText');

        function updateMetrics() {
            const totalCollected = collections.reduce((sum, item) => sum + item.amount, 0);
            const totalSpent = expenses.reduce((sum, item) => sum + item.amount, 0);
            const cashInHand = totalCollected - totalSpent;
            
            const remainingGap = Math.max(0, TARGET_GOAL - totalCollected);
            const percent = Math.min(100, Math.round((totalCollected / TARGET_GOAL) * 100));

            // Display changes
            totalCollDisp.innerText = `₹${totalCollected.toLocaleString('en-IN')}`;
            totalSpentDisp.innerText = `₹${totalSpent.toLocaleString('en-IN')}`;
            cashInHandDisp.innerText = `₹${cashInHand.toLocaleString('en-IN')}`;
            
            // Adjust warning colors if overspent out of real cash in hand
            if (cashInHand < 0) {
                cashInHandDisp.className = "text-2xl font-bold text-red-600 mt-1 block";
            } else {
                cashInHandDisp.className = "text-2xl font-bold text-blue-700 mt-1 block";
            }

            progressBar.style.width = `${percent}%`;
            progressPctText.innerText = `${percent}% Target Reached`;
            remainingGapText.innerText = remainingGap > 0 ? `Remaining Gap: ₹${remainingGap.toLocaleString('en-IN')}` : `🎉 Target Met!`;
        }

        function renderCollectionTable() {
            document.querySelectorAll('.coll-row').forEach(el => el.remove());
            if (collections.length === 0) {
                emptyCollMsg.style.display = 'table-row';
                return;
            }
            emptyCollMsg.style.display = 'none';

            collections.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = 'coll-row hover:bg-gray-50 transition';
                tr.innerHTML = `
                    <td class="p-3 font-medium text-gray-700">${item.name}</td>
                    <td class="p-3 font-semibold text-emerald-600">₹${item.amount.toLocaleString('en-IN')}</td>
                    <td class="p-3 text-right">
                        <button onclick="removeCollection(${index})" class="text-red-400 hover:text-red-600 px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                collTableBody.appendChild(tr);
            });
        }

        function renderExpenseTable() {
            document.querySelectorAll('.exp-row').forEach(el => el.remove());
            if (expenses.length === 0) {
                emptyExpMsg.style.display = 'table-row';
                return;
            }
            emptyExpMsg.style.display = 'none';

            expenses.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = 'exp-row hover:bg-gray-50 transition';
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-xs text-orange-600 uppercase tracking-tight">${item.category}</td>
                    <td class="p-3 text-gray-600">${item.detail}</td>
                    <td class="p-3 font-semibold text-red-600">₹${item.amount.toLocaleString('en-IN')}</td>
                    <td class="p-3 text-right">
                        <button onclick="removeExpense(${index})" class="text-red-400 hover:text-red-600 px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                expTableBody.appendChild(tr);
            });
        }

        function addCollection() {
            const nameInput = document.getElementById('contributorName');
            const amtInput = document.getElementById('contributorAmount');
            const name = nameInput.value.trim();
            const amount = parseInt(amtInput.value);

            if (!name || isNaN(amount) || amount <= 0) {
                alert('Enter a proper name/house and a valid collection amount.');
                return;
            }

            collections.push({ name, amount });
            nameInput.value = '';
            amtInput.value = '';
            
            renderCollectionTable();
            updateMetrics();
        }

        function addExpense() {
            const catSelect = document.getElementById('expenseCategory');
            const detailInput = document.getElementById('expenseDetail');
            const amtInput = document.getElementById('expenseAmount');
            
            const category = catSelect.value;
            const detail = detailInput.value.trim() || "General Expense";
            const amount = parseInt(amtInput.value);

            if (isNaN(amount) || amount <= 0) {
                alert('Please input a valid cost amount spent.');
                return;
            }

            expenses.push({ category, detail, amount });
            detailInput.value = '';
            amtInput.value = '';

            renderExpenseTable();
            updateMetrics();
        }

        function removeCollection(index) {
            collections.splice(index, 1);
            renderCollectionTable();
            updateMetrics();
        }

        function removeExpense(index) {
            expenses.splice(index, 1);
            renderExpenseTable();
            updateMetrics();
        }

        // Initialize with default template data so it looks active out-of-the-box
        window.onload = function() {
            collections = [
                { name: "Shop Corner Banner Sponsor", amount: 2500 },
                { name: "House No. 12", amount: 1000 },
                { name: "House No. 45", amount: 500 }
            ];
            expenses = [
                { category: "Flex & Banners", detail: "Advance for Entrance Flex", amount: 1000 },
                { category: "Lighting & Ambience", detail: "Pixel Light Series Purchase", amount: 3000 }
            ];
            renderCollectionTable();
            renderExpenseTable();
            updateMetrics();
        };
      </script>
